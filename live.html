<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCI Retry - Live</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0f172a; color: #e2e8f0; font-family: -apple-system, sans-serif; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #60a5fa; margin-bottom: 20px; font-size: 24px; }
        
        .hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: #1e293b; border-radius: 12px; padding: 25px; text-align: center; }
        .card .label { color: #94a3b8; font-size: 14px; text-transform: uppercase; margin-bottom: 10px; }
        .card .value { font-size: 36px; font-weight: bold; }
        .card.green .value { color: #4ade80; }
        .card.red .value { color: #f87171; }
        .card.blue .value { color: #60a5fa; }
        .card.yellow .value { color: #fbbf24; }
        
        .tenants { margin-bottom: 30px; }
        .tenants h2 { color: #94a3b8; font-size: 14px; text-transform: uppercase; margin-bottom: 15px; }
        .tenant-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .tenant-card { background: #1e293b; border-radius: 8px; padding: 20px; border-left: 4px solid #64748b; }
        .tenant-card.maperryspeaks { border-left-color: #f97316; }
        .tenant-card.phoenix { border-left-color: #ef4444; }
        .tenant-card .name { font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        .tenant-card .stat { display: flex; justify-content: space-between; color: #94a3b8; padding: 5px 0; border-bottom: 1px solid #334155; }
        .tenant-card .stat:last-child { border-bottom: none; }
        .tenant-card .stat .num { color: #e2e8f0; font-weight: bold; }
        .tenant-card .stat.success .num { color: #4ade80; }
        .tenant-card .stat.failed .num { color: #f87171; }
        
        .log { background: #1e293b; border-radius: 12px; padding: 20px; }
        .log h2 { color: #94a3b8; font-size: 14px; text-transform: uppercase; margin-bottom: 15px; }
        .log pre { font-family: 'SF Mono', Monaco, monospace; font-size: 13px; line-height: 1.6; max-height: 400px; overflow-y: auto; white-space: pre-wrap; }
        .log .s { color: #4ade80; }
        .log .f { color: #f87171; }
        .log .w { color: #fbbf24; }
        .log .i { color: #60a5fa; }
        .log .l { color: #c084fc; }
        
        .time { color: #666; font-size: 12px; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>OCI Instance Launcher</h1>
        
        <div class="hero">
            <div class="card blue">
                <div class="label">Running Time</div>
                <div class="value" id="runtime">--:--:--</div>
            </div>
            <div class="card green">
                <div class="label">Success</div>
                <div class="value" id="success">0</div>
            </div>
            <div class="card red">
                <div class="label">Failed</div>
                <div class="value" id="failed">0</div>
            </div>
            <div class="card">
                <div class="label">Cycles</div>
                <div class="value" id="cycles">0</div>
            </div>
            <div class="card yellow">
                <div class="label">Next Retry</div>
                <div class="value" id="nextretry">--</div>
            </div>
        </div>
        
        <div class="tenants">
            <h2>Tenant Statistics</h2>
            <div class="tenant-grid" id="tenant-grid">
                <!-- Filled by JS -->
            </div>
        </div>
        
        <div class="log">
            <h2>Recent Activity</h2>
            <pre id="log-output">Loading...</pre>
        </div>
        
        <div class="time">Auto-refreshes every 5 seconds</div>
    </div>

    <script>
        let startTime = null;
        let timerInterval;
        let lastSleepSec = 0;
        
        async function load() {
            try {
                const r = await fetch('public/retry.log?t=' + Date.now());
                const text = await r.text();
                const lines = text.split('\n');
                
                // Stats
                const success = (text.match(/SUCCESS:/g) || []).length;
                const failed = (text.match(/FAILED:/g) || []).length;
                const cycles = (text.match(/Cycle Complete/g) || []).length;
                
                document.getElementById('success').textContent = success;
                document.getElementById('failed').textContent = failed;
                document.getElementById('cycles').textContent = cycles;
                
                // Parse next retry time from last Sleeping line
                const sleepMatch = text.match(/Sleeping (\d+)s \(base: (\d+)s, jitter: ([-\d]+)s\)/);
                if (sleepMatch) {
                    lastSleepSec = parseInt(sleepMatch[1]);
                    document.getElementById('nextretry').textContent = lastSleepSec + 's';
                }
                
                const perHour = success + failed > 0 && startTime ? Math.round((success + failed) / ((Date.now() - startTime) / 3600000)) : 0;
                document.getElementById('perhour').textContent = perHour || 0;
                
                // Tenant stats
                const tenantStats = {};
                const tenantAttempts = text.match(/Trying (\S+) for (\S+)/g) || [];
                tenantAttempts.forEach(m => {
                    const [, tenant] = m.match(/Trying (\S+)/);
                    if (!tenantStats[tenant]) tenantStats[tenant] = { attempts: 0, success: 0, failed: 0 };
                    tenantStats[tenant].attempts++;
                });
                const tenantSuccesses = text.match(/SUCCESS: Launched \S+ on (\S+)/g) || [];
                tenantSuccesses.forEach(m => {
                    const [, tenant] = m.match(/on (\S+)/);
                    if (tenantStats[tenant]) tenantStats[tenant].success++;
                });
                const tenantFails = text.match(/FAILED: (\S+) failed/g) || [];
                tenantFails.forEach(m => {
                    const [, tenant] = m.match(/FAILED: (\S+)/);
                    if (tenantStats[tenant]) tenantStats[tenant].failed++;
                });
                
                const grid = document.getElementById('tenant-grid');
                grid.innerHTML = Object.entries(tenantStats).map(([name, s]) => {
                    const cls = name.includes('phoenix') ? 'phoenix' : 'maperryspeaks';
                    return `<div class="tenant-card ${cls}">
                        <div class="name">${name}</div>
                        <div class="stat"><span>Attempts</span><span class="num">${s.attempts}</span></div>
                        <div class="stat success"><span>Success</span><span class="num">${s.success}</span></div>
                        <div class="stat failed"><span>Failed</span><span class="num">${s.failed}</span></div>
                    </div>`;
                }).join('');
                
                // Start time from first log line
                const firstMatch = text.match(/^\[(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})\]/);
                if (firstMatch && !startTime) {
                    startTime = new Date(firstMatch[1]).getTime();
                    updateRuntime();
                    timerInterval = setInterval(updateRuntime, 1000);
                }
                
                // Log output
                const recent = lines.slice(-30);
                const output = recent.filter(l => {
                    if (!l.trim()) return false;
                    if (l.includes('Starting')) return false;
                    if (l.includes('Loaded')) return false;
                    if (l.includes('Instances dir')) return false;
                    if (l.includes('Tenants:')) return false;
                    return true;
                }).map(line => {
                    let cls = '';
                    if (line.includes('SUCCESS')) cls = 's';
                    else if (line.includes('FAILED')) cls = 'f';
                    else if (line.includes('WARNING')) cls = 'w';
                    else if (line.includes('Cycle Complete')) cls = 'i';
                    else if (line.includes('Sleeping')) cls = 'w';
                    else if (line.includes('LAUNCH')) cls = 'l';
                    return cls ? `<span class="${cls}">${escapeHtml(line)}</span>` : escapeHtml(line);
                }).join('\n');
                
                document.getElementById('log-output').innerHTML = output;
                
            } catch (e) {
                document.getElementById('log-output').textContent = 'Error: ' + e.message;
            }
        }
        
        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        
        function updateRuntime() {
            if (!startTime) return;
            const diff = Math.floor((Date.now() - startTime) / 1000);
            const h = Math.floor(diff / 3600);
            const m = Math.floor((diff % 3600) / 60);
            const s = diff % 60;
            document.getElementById('runtime').textContent = 
                String(h).padStart(2, '0') + ':' + 
                String(m).padStart(2, '0') + ':' + 
                String(s).padStart(2, '0');
        }
        
        load();
        setInterval(load, 5000);
    </script>
</body>
</html>
