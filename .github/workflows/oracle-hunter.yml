name: Oracle ARM Hunter

on:
  schedule:
    # يتم تشغيل السكريبت كل 4 ساعات لتجنب حظر GitHub (6 مرات باليوم)
    - cron: '0 */4 * * *'
  workflow_dispatch: # زر للتشغيل اليدوي في أي وقت

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    # حد أقصى للتشغيل 3 ساعات ونصف (210 دقيقة) حتى لا ينغلق بسبب قوانين GitHub
    timeout-minutes: 210 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Create .env and Key files
        run: |
          # إنشاء ملف المفتاح الخاص وإعطائه الصلاحيات الصحيحة
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > oci_api_key.pem
          chmod 600 oci_api_key.pem
          
          # بناء ملف الإعدادات .env ليقرأه السكريبت الأساسي
          cat <<EOF > .env
          OCI_REGION=${{ secrets.OCI_REGION }}
          OCI_USER_ID=${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID=${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT=${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_PRIVATE_KEY_FILENAME=oci_api_key.pem
          OCI_SUBNET_ID=${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID=${{ secrets.OCI_IMAGE_ID }}
          OCI_OCPUS=2
          OCI_MEMORY_IN_GBS=12
          OCI_BOOT_VOLUME_SIZE_IN_GBS=100
          OCI_SHAPE=VM.Standard.A1.Flex
          OCI_MAX_INSTANCES=1
          EOF

      - name: Install Dependencies and Run Script
        run: |
          # تشغيل السكريبت ليبدأ محاولات الصيد
          php index.php
