name: Oracle ARM Hunter

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 210 

    steps:
      # هذا التعديل الجديد: يسحب كود الأداة من مستودع المبرمج مباشرة
      - name: Checkout Matthew's Code
        uses: actions/checkout@v3
        with:
          repository: 'matthewxmurphy/oci-arm-host-capacity'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      # تحميل الحزم والمكاتب المطلوبة للسكريبت
      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Create .env and Key files
        run: |
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > oci_api_key.pem
          chmod 600 oci_api_key.pem
          
          cat <<EOF > .env
          OCI_REGION=${{ secrets.OCI_REGION }}
          OCI_USER_ID=${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID=${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT=${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_PRIVATE_KEY_FILENAME=oci_api_key.pem
          OCI_SUBNET_ID=${{ secrets.OCI_SUBNET_ID }}
          OCI_OCPUS=2
          OCI_MEMORY_IN_GBS=12
          OCI_BOOT_VOLUME_SIZE_IN_GBS=100
          OCI_SHAPE=VM.Standard.A1.Flex
          OCI_MAX_INSTANCES=1
          EOF

      - name: Run Script
        run: |
          php index.php
