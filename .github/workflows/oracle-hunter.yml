name: Oracle ARM Sniper

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run-sniper:
    runs-on: ubuntu-latest
    timeout-minutes: 210 

    steps:
      - name: Setup Oracle CLI & Auth
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          
          # إخفاء تحذيرات الصلاحيات
          echo "OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True" >> $GITHUB_ENV
          
          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_ID }}
          fingerprint=${{ secrets.OCI_KEY_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_ID }}
          region=${{ secrets.OCI_REGION }}
          key_file=/home/runner/.oci/key.pem
          EOF
          
          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" -- --accept-all-defaults
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: The Sniper Loop
        run: |
          export PATH=/home/runner/bin:$PATH
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          
          # وظيفة إرسال الرسائل
          send_tg() {
            curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$1"
          }

          send_tg "[#MalaZ] Sniper started. Monitoring capacity..."

          AD=$(oci iam availability-domain list --compartment-id "${{ secrets.OCI_TENANCY_ID }}" --query 'data[0].name' --raw-output)
          IMAGE_ID=$(oci compute image list --all --operating-system "Canonical Ubuntu" --operating-system-version "22.04" --shape "VM.Standard.A1.Flex" --compartment-id "${{ secrets.OCI_TENANCY_ID }}" --query 'data[0].id' --raw-output)
          
          while true; do
            echo "[$(date)] Attempting to provision server..."
            
            timeout 20 oci compute instance launch \
              --availability-domain "$AD" \
              --compartment-id "${{ secrets.OCI_TENANCY_ID }}" \
              --shape "VM.Standard.A1.Flex" \
              --subnet-id "${{ secrets.OCI_SUBNET_ID }}" \
              --image-id "$IMAGE_ID" \
              --shape-config '{"ocpus": 2, "memoryInGBs": 12}' \
              --boot-volume-size-in-gbs 100 \
              --display-name "Minecraft-Server" > response.json 2>&1 || true

            # التحقق من النتيجة وإرسال التنبيه
            if grep -q "PROVISIONING" response.json || grep -q "RUNNING" response.json; then
              send_tg "[#MalaZ] SUCCESS! Server provisioned successfully. Check your Oracle console!"
              break
            elif grep -q "Out of host capacity" response.json; then
              send_tg "[#MalaZ] Attempt failed: Out of capacity."
            else
              # إرسال ملخص قصير للخطأ لتجنب كسر رسالة التيليجرام
              ERR_MSG=$(grep -o '"message": "[^"]*"' response.json | head -1 || echo "Unknown error")
              send_tg "[#MalaZ] Error occurred: $ERR_MSG. See GitHub logs for details."
            fi
            
            sleep 60
          done
