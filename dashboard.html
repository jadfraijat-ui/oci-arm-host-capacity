<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCI Instance Launcher</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; }
        .container { max-width: 1400px; margin: 0 auto; width: 100%; flex: 1; }
        h1 { color: #60a5fa; margin-bottom: 20px; }
        
        nav { background: #1e293b; padding: 10px 20px; margin-bottom: 20px; border-radius: 8px; }
        nav ul { list-style: none; display: flex; gap: 20px; flex-wrap: wrap; }
        nav a { color: #94a3b8; text-decoration: none; padding: 8px 16px; border-radius: 6px; }
        nav a:hover, nav a.active { background: #334155; color: #60a5fa; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .stats { display: flex; gap: 20px; flex-wrap: wrap; }
        .stat { background: #1e293b; padding: 15px 25px; border-radius: 8px; text-align: center; }
        .stat .label { color: #94a3b8; font-size: 12px; text-transform: uppercase; }
        .stat .value { font-size: 28px; font-weight: bold; }
        .stat.success .value { color: #4ade80; }
        .stat.failed .value { color: #f87171; }
        .stat.active .value { color: #60a5fa; }
        .btn { background: #3b82f6; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; display: inline-block; }
        .btn:hover { opacity: 0.8; }
        .log-frame { width: 100%; height: 60vh; border: none; border-radius: 8px; background: #1e293b; }
        .timestamp { color: #64748b; margin-bottom: 10px; }
        
        footer { text-align: center; padding: 20px; color: #64748b; font-size: 12px; margin-top: auto; }
        footer a { color: #60a5fa; text-decoration: none; }
        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="./">Dashboard</a></li>
            <li><a href="dashboard.html" class="active">Full Dashboard</a></li>
            <li><a href="README.md">README</a></li>
            <li><a href="https://github.com/matthewxmurphy/oci-arm-host-capacity" target="_blank">GitHub</a></li>
        </ul>
    </nav>
    
    <div class="container">
        <h1>OCI Instance Launcher - Full Log</h1>
        
        <div class="header">
            <div class="stats">
                <div class="stat success">
                    <div class="label">Success</div>
                    <div class="value" id="success">0</div>
                </div>
                <div class="stat failed">
                    <div class="label">Failed</div>
                    <div class="value" id="failed">0</div>
                </div>
                <div class="stat active">
                    <div class="label">Cycles</div>
                    <div class="value" id="cycles">0</div>
                </div>
            </div>
            <a href="live.html" class="btn">Compact View</a>
        </div>
        
        <div class="timestamp">Last updated: <span id="time"></span> · Version 1.2.0</div>
        
        <iframe class="log-frame" src="public/retry.log"></iframe>
    </div>
    
    <footer>
        Updated for <a href="https://www.net30hosting.com" target="_blank">Net 30 Hosting</a> by <a href="https://www.matthewxmurphy.com" target="_blank">Matthew X Murphy</a>
    </footer>
    
    <script>
        function updateStats() {
            fetch('public/retry.log?t=' + Date.now())
                .then(r => r.text())
                .then(text => {
                    const success = (text.match(/SUCCESS:/g) || []).length;
                    const failed = (text.match(/FAILED:/g) || []).length;
                    const cycles = (text.match(/Cycle Complete/g) || []).length;
                    document.getElementById('success').textContent = success;
                    document.getElementById('failed').textContent = failed;
                    document.getElementById('cycles').textContent = cycles;
                    document.getElementById('time').textContent = new Date().toLocaleTimeString();
                });
        }
        
        updateStats();
        setInterval(updateStats, 10000);
    </script>
</body>
</html>
